name: judge-answers
on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * *"
permissions:
  contents: write
concurrency:
  group: judge
  cancel-in-progress: false
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Judge answers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python eval/scripts/run_judge.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "eval-bot"
          git config user.email "eval-bot@users.noreply.github.com"
          git add results/judged
          git diff --cached --quiet && exit 0
          git commit -m "Add judge verdicts"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done; exit 1
