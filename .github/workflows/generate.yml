name: generate-answers
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: write
  models: read
jobs:
  gen:
    runs-on: ubuntu-latest
    concurrency:
      group: generate-${{ matrix.provider }}
      cancel-in-progress: false
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        provider: [groq, github, nvidia, mistral, openrouter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate answers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python eval/scripts/run_gen.py ${{ matrix.provider }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "eval-bot"
          git config user.email "eval-bot@users.noreply.github.com"
          git add results/runs
          git diff --cached --quiet && exit 0
          git commit -m "Add generated answers (${{ matrix.provider }})"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break || sleep 5; done
